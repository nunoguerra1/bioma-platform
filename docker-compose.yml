version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bioma-postgres
    restart: always
    environment:
      POSTGRES_USER: bioma_user
      POSTGRES_PASSWORD: bioma_password
      POSTGRES_DB: bioma_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: